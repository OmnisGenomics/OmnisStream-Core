name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release-preflight:
    uses: OmnisGenomics/.github/.github/workflows/release.yml@main

  nix-ci:
    needs: release-preflight
    uses: OmnisGenomics/.github/.github/workflows/nix-ci.yml@main
    with:
      publish_cache: true
    secrets: inherit

  publish:
    name: Publish release archive
    needs: nix-ci
    runs-on:
      - self-hosted
      - Linux
      - X64
      - monarchic-local
      - nixos
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.MONARCHIC_GITHUB_PAT || github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.MONARCHIC_GITHUB_PAT || github.token }}
            accept-flake-config = true

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          nix build .#release-archive
          mkdir -p dist
          cp result/*.zip result/SHA256SUMS dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
